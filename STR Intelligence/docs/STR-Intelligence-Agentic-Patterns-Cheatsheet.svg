<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">STR Intelligence agentic patterns cheatsheet</title>
  <desc id="desc">A hand-drawn educational infographic explaining the STR Intelligence workflow and the agentic patterns used throughout the system.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="14" result="n"/>
      <feComponentTransfer in="n" result="f"><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="f" mode="multiply"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#161a18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .bg{fill:#fffef9}.panel{fill:#fff;stroke:#171b19;stroke-width:3.5;rx:22}.mini{fill:#fff;stroke:#52605a;stroke-width:2.3;rx:16}.yellow{fill:#ffd92f}.green{fill:#dff0e7}.blue{fill:#dff0f7}.peach{fill:#f8e5d5}.pink{fill:#f4e2e8}.ink{fill:#171b19}.muted{fill:#4f5d57}.white{fill:#fff}.title{font:900 74px Impact,'Arial Black',sans-serif;letter-spacing:1px}.h1{font:900 37px Impact,'Arial Black',sans-serif;letter-spacing:.7px}.h2{font:800 27px 'Arial Narrow','Avenir Next',sans-serif}.body{font:500 22px 'Avenir Next','Trebuchet MS',sans-serif}.small{font:500 18px 'Avenir Next','Trebuchet MS',sans-serif}.tiny{font:600 16px 'Avenir Next','Trebuchet MS',sans-serif}.label{font:900 21px 'Arial Narrow','Avenir Next',sans-serif;letter-spacing:.7px}.sketch{fill:none;stroke:#171b19;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#52605a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#171b19;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#79847f;stroke-width:2.2;stroke-dasharray:8 9}.center{text-anchor:middle}.right{text-anchor:end}
    </style>
  </defs>
  <rect width="1600" height="2000" class="bg" filter="url(#paper)"/>

  <!-- Masthead -->
  <text x="76" y="66" class="label ink">KAJAL PATEL · WEEK 3</text>
  <path d="M490 53 l18-28 M512 62 l34-18 M532 78 l35 2 M1080 52 l-14-31 M1103 60 l28-23 M1119 78 l38-4" class="sketch" stroke="#f2bc00"/>
  <rect x="420" y="86" width="760" height="72" class="yellow" rx="6" transform="rotate(-1 800 122)"/>
  <text x="800" y="145" class="title ink center">STR INTELLIGENCE</text>
  <text x="800" y="194" class="h2 ink center">AGENTIC PATTERNS CHEATSHEET</text>
  <text x="800" y="229" class="small muted center">How a property-search sentence becomes an evidence-backed investment decision.</text>

  <!-- Panel 1: flow -->
  <rect x="62" y="265" width="1476" height="300" class="panel"/>
  <rect x="86" y="246" width="430" height="52" class="yellow" rx="8" transform="rotate(-.7 300 272)"/>
  <text x="108" y="284" class="h1 ink">WHAT DOES THE SYSTEM DO?</text>
  <g transform="translate(100 335)">
    <circle cx="90" cy="70" r="54" class="green" stroke="#171b19" stroke-width="3"/>
    <path d="M58 57 q0-18 18-18 h42 q18 0 18 18 v18 q0 18-18 18 h-27 l-18 16 4-16h-1q-18 0-18-18z" class="sketch"/>
    <text x="90" y="151" class="label center">ASK</text><text x="90" y="176" class="tiny muted center">natural language</text>
    <path d="M160 70 C185 66 198 67 220 69" class="flow"/>
    <circle cx="300" cy="70" r="54" class="blue" stroke="#171b19" stroke-width="3"/>
    <circle cx="287" cy="57" r="20" class="sketch"/><path d="M303 73 l25 25" class="sketch"/><path d="M269 89 q18-11 37 0" class="thin"/>
    <text x="300" y="151" class="label center">DISCOVER</text><text x="300" y="176" class="tiny muted center">Homes or Land</text>
    <path d="M370 70 C395 66 408 67 430 69" class="flow"/>
    <circle cx="510" cy="70" r="54" class="peach" stroke="#171b19" stroke-width="3"/>
    <path d="M479 41 h62 v62 h-62z M492 61 l10 10 24-26 M492 84 h34" class="sketch"/>
    <text x="510" y="151" class="label center">SCREEN</text><text x="510" y="176" class="tiny muted center">attention + confidence</text>
    <path d="M580 70 C605 66 618 67 640 69" class="flow"/>
    <circle cx="720" cy="70" r="54" class="pink" stroke="#171b19" stroke-width="3"/>
    <path d="M684 78 q36-55 72 0 M696 78 q24-32 48 0 M708 78 q12-14 24 0 M720 88 v20" class="sketch"/>
    <text x="720" y="151" class="label center">COMPARE</text><text x="720" y="176" class="tiny muted center">nearby Airbnb stays</text>
    <path d="M790 70 C815 66 828 67 850 69" class="flow"/>
    <circle cx="930" cy="70" r="54" class="green" stroke="#171b19" stroke-width="3"/>
    <path d="M894 95 h72 M906 95 v-28 h14v28 M926 95 v-48h14v48 M946 95 v-63h14v63" class="sketch"/>
    <text x="930" y="151" class="label center">ANALYZE</text><text x="930" y="176" class="tiny muted center">financial returns</text>
    <path d="M1000 70 C1025 66 1038 67 1060 69" class="flow"/>
    <circle cx="1140" cy="70" r="54" class="blue" stroke="#171b19" stroke-width="3"/>
    <path d="M1112 75 q28-46 56 0 M1118 76 q-5 28 22 30 M1162 76 q5 28-22 30 M1123 56 q17-17 34 0 M1132 80 h16" class="sketch"/>
    <text x="1140" y="151" class="label center">EVALUATE</text><text x="1140" y="176" class="tiny muted center">STR potential</text>
  </g>

  <!-- Panel 2: anatomy -->
  <rect x="62" y="600" width="724" height="490" class="panel"/>
  <rect x="86" y="581" width="396" height="52" class="yellow" rx="8" transform="rotate(.6 284 607)"/>
  <text x="108" y="619" class="h1 ink">ANATOMY OF A RUN</text>
  <circle cx="425" cy="812" r="100" fill="#171b19"/>
  <path d="M382 790 q43-60 86 0 M390 790 q-7 56 35 69 M460 790 q7 56-35 69 M397 770 q28-25 56 0 M410 809 h30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="425" y="885" class="tiny white center">LANGGRAPH RUN</text>
  <rect x="90" y="676" width="230" height="94" class="mini green"/><text x="112" y="708" class="label ink">TYPED STATE</text><text x="112" y="736" class="small muted">request, records, errors</text><text x="112" y="760" class="small muted">criteria, references</text>
  <rect x="90" y="831" width="230" height="94" class="mini blue"/><text x="112" y="863" class="label ink">TOOLS</text><text x="112" y="891" class="small muted">Apify, Supabase</text><text x="112" y="915" class="small muted">calculators, model</text>
  <rect x="530" y="676" width="230" height="94" class="mini peach"/><text x="552" y="708" class="label ink">ROUTER</text><text x="552" y="736" class="small muted">Home · Land · Invalid</text><text x="552" y="760" class="small muted">fresh · stale · miss</text>
  <rect x="530" y="831" width="230" height="94" class="mini pink"/><text x="552" y="863" class="label ink">OUTPUT</text><text x="552" y="891" class="small muted">safe DTOs, reasons</text><text x="552" y="915" class="small muted">scores, saved evidence</text>
  <path d="M320 728 C345 738 351 757 365 770 M320 878 C345 868 350 852 365 838 M530 728 C505 738 499 757 485 770 M530 878 C505 868 500 852 485 838" class="dash"/>
  <rect x="90" y="962" width="670" height="92" class="mini"/>
  <path d="M112 1007 q13-31 26 0 q14-31 28 0" class="sketch"/><text x="188" y="998" class="label ink">BIG IDEA</text><text x="188" y="1028" class="small muted">State moves through the graph. Tools do bounded work.</text>

  <!-- Panel 3: pattern map -->
  <rect x="814" y="600" width="724" height="490" class="panel"/>
  <rect x="838" y="581" width="420" height="52" class="yellow" rx="8" transform="rotate(-.6 1048 607)"/>
  <text x="860" y="619" class="h1 ink">WHERE PATTERNS APPEAR</text>
  <g>
    <rect x="850" y="674" width="308" height="112" class="mini green"/><text x="876" y="706" class="label ink">1 · ROUTING</text><text x="876" y="736" class="small muted">Natural language → typed</text><text x="876" y="762" class="small muted">Home, Land, or Invalid</text>
    <rect x="1180" y="674" width="322" height="112" class="mini blue"/><text x="1206" y="706" class="label ink">2 · SEQUENCE</text><text x="1206" y="736" class="small muted">Normalize → validate</text><text x="1206" y="762" class="small muted">dedupe → persist</text>
    <rect x="850" y="806" width="308" height="112" class="mini peach"/><text x="876" y="838" class="label ink">3 · RETRIEVAL FIRST</text><text x="876" y="868" class="small muted">Check saved evidence</text><text x="876" y="894" class="small muted">before a paid call</text>
    <rect x="1180" y="806" width="322" height="112" class="mini pink"/><text x="1206" y="838" class="label ink">4 · HUMAN CONTROL</text><text x="1206" y="868" class="small muted">User triggers paid and</text><text x="1206" y="894" class="small muted">deeper actions</text>
    <rect x="850" y="938" width="652" height="116" class="mini green"/><text x="876" y="970" class="label ink">5 · CONDITIONAL MULTIMODAL</text><text x="876" y="1000" class="small muted">Only call the vision model when requested—and only with enough evidence.</text><text x="876" y="1028" class="small muted">The model interprets; deterministic code still controls the system.</text>
  </g>

  <!-- Panel 4: retrieval loop -->
  <rect x="62" y="1125" width="1476" height="320" class="panel"/>
  <rect x="86" y="1106" width="478" height="52" class="yellow" rx="8" transform="rotate(-.5 325 1132)"/>
  <text x="108" y="1144" class="h1 ink">THE COST-SAVING MEMORY LOOP</text>
  <text x="108" y="1191" class="small muted">Before calling the Airbnb actor, ask Supabase what the system already knows.</text>
  <g transform="translate(105 1225)">
    <rect x="0" y="0" width="236" height="108" class="mini blue"/><text x="118" y="43" class="label ink center">CHECK MEMORY</text><text x="118" y="76" class="small muted center">saved comparison?</text>
    <path d="M246 54 C270 50 282 51 304 53" class="flow"/>
    <polygon points="402,0 500,54 402,108 304,54" fill="#fff7c6" stroke="#171b19" stroke-width="2.5"/><text x="402" y="48" class="label ink center">FRESH?</text><text x="402" y="75" class="tiny muted center">yes / no</text>
    <path d="M500 54 C525 50 537 51 559 53" class="flow"/>
    <rect x="570" y="0" width="270" height="108" class="mini green"/><text x="705" y="43" class="label ink center">YES → REUSE</text><text x="705" y="76" class="small muted center">zero provider cost</text>
    <path d="M402 108 C402 130 402 138 402 156" class="flow"/>
    <rect x="270" y="164" width="264" height="76" class="mini peach"/><text x="402" y="197" class="label ink center">NO → COLLECT</text><text x="402" y="224" class="tiny muted center">Apify Airbnb actor</text>
    <path d="M544 202 C567 199 581 199 604 201" class="flow"/>
    <rect x="615" y="164" width="245" height="76" class="mini pink"/><text x="738" y="197" class="label ink center">RANK FIVE</text><text x="738" y="224" class="tiny muted center">save new evidence</text>
    <path d="M860 202 C1000 208 1035 128 1035 90 C1035 56 992 46 857 54" class="flow"/>
    <rect x="920" y="0" width="395" height="108" class="mini"/><text x="944" y="36" class="label ink">SAFE FALLBACK</text><text x="944" y="67" class="small muted">If refresh fails, return useful</text><text x="944" y="92" class="small muted">saved evidence when possible.</text>
  </g>

  <!-- Panel 5: deterministic vs model -->
  <rect x="62" y="1480" width="724" height="380" class="panel"/>
  <rect x="86" y="1461" width="430" height="52" class="yellow" rx="8" transform="rotate(.5 301 1487)"/>
  <text x="108" y="1499" class="h1 ink">CODE OR MODEL?</text>
  <rect x="92" y="1544" width="320" height="250" class="mini green"/>
  <text x="252" y="1583" class="h2 ink center">DETERMINISTIC CODE</text>
  <text x="252" y="1627" class="small ink center">• routing + validation</text>
  <text x="252" y="1664" class="small ink center">• attention scoring</text>
  <text x="252" y="1701" class="small ink center">• financial mathematics</text>
  <text x="252" y="1751" class="tiny muted center">Repeatable · testable · auditable</text>
  <circle cx="425" cy="1666" r="41" fill="#171b19"/><text x="425" y="1675" class="label white center">VS</text>
  <rect x="438" y="1544" width="320" height="250" class="mini peach"/>
  <text x="598" y="1583" class="h2 ink center">VISION MODEL</text>
  <text x="598" y="1627" class="small ink center">• photos + listing text</text>
  <text x="598" y="1664" class="small ink center">• qualitative potential</text>
  <text x="598" y="1701" class="small ink center">• strengths + risks + ideas</text>
  <text x="598" y="1751" class="tiny muted center">On demand · evidence grounded</text>
  <rect x="92" y="1810" width="666" height="32" class="yellow" rx="5"/><text x="425" y="1833" class="tiny ink center">Deterministic when possible. Generative only when interpretation helps.</text>

  <!-- Panel 6: user control -->
  <rect x="814" y="1480" width="724" height="380" class="panel"/>
  <rect x="838" y="1461" width="438" height="52" class="yellow" rx="8" transform="rotate(-.5 1057 1487)"/>
  <text x="860" y="1499" class="h1 ink">WHO MAKES THE DECISION?</text>
  <path d="M920 1595 q0-42 40-42 q40 0 40 42 M930 1597 q-7 68 30 89 M990 1597 q7 68-30 89 M920 1714 q40-48 80 0" class="sketch"/>
  <text x="960" y="1760" class="h2 ink center">THE INVESTOR</text>
  <path d="M1050 1570 h410 M1050 1625 h410 M1050 1680 h410 M1050 1735 h410" class="thin"/>
  <text x="1072" y="1602" class="body ink">✓ starts paid provider actions</text>
  <text x="1072" y="1657" class="body ink">✓ edits financial assumptions</text>
  <text x="1072" y="1712" class="body ink">✓ requests deeper AI analysis</text>
  <text x="1072" y="1767" class="body ink">✓ makes the investment decision</text>
  <rect x="846" y="1810" width="660" height="32" class="yellow" rx="5"/><text x="1176" y="1833" class="tiny ink center">The system supports judgment. It does not replace it.</text>

  <!-- Footer -->
  <path d="M70 1904 C350 1897 620 1910 898 1902 S1270 1907 1530 1901" class="dash"/>
  <text x="76" y="1948" class="label ink">THE TAKEAWAY</text>
  <text x="270" y="1948" class="body ink">Reliable agents need clear state, bounded tools, recovery paths, and human control—not unlimited autonomy.</text>
  <text x="76" y="1982" class="tiny muted">LANGGRAPH · LANGCHAIN · REACT · TYPESCRIPT · APIFY · SUPABASE · OPENROUTER</text>
  <text x="1522" y="1982" class="tiny muted right">STR Intelligence</text>
</svg>
